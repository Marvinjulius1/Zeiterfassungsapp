<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Keine Verbindung – Zeitgeist</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #000; color: #f5f5f7; font-family: -apple-system, system-ui, sans-serif; }
      main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: 24px; text-align: center; box-sizing: border-box; }
      .icon { width: 80px; height: 80px; border-radius: 50%; background: #161618; display: flex; align-items: center; justify-content: center; }
      h1 { font-size: 28px; margin: 0; letter-spacing: -0.02em; }
      p { margin: 0; color: #a1a1a8; font-size: 15px; line-height: 1.5; max-width: 340px; }
      button { appearance: none; border: 0; border-radius: 999px; background: #f5f5f7; color: #000; font: 600 16px/1 inherit; padding: 16px 28px; }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#a1a1a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.5"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="m2 2 20 20"/></svg>
      </div>
      <h1>Keine Verbindung</h1>
      <p>Zeitgeist kann den Server gerade nicht erreichen. Prüfe WLAN oder mobile Daten und versuch es noch einmal.</p>
      <button type="button" id="retry">Erneut versuchen</button>
    </main>
    <script>
      // Zurück zur App – Capacitor merkt sich die Server-Adresse
      document.getElementById("retry").addEventListener("click", function () {
        var url = (window.Capacitor && window.Capacitor.getServerUrl && window.Capacitor.getServerUrl()) || null;
        if (url) window.location.href = url.replace(/\/$/, "") + "/start";
        else window.history.back();
      });
    </script>
  </body>
</html>

<!doctype html>
<html lang="de">
  <body style="margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Inter',Segoe UI,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="padding:48px 24px;">
      <tr><td align="center">
        <table width="100%" style="max-width:440px;">
          <tr><td style="font-size:22px;font-weight:600;letter-spacing:-0.04em;">zeitgeist<span style="color:#30d158;">.</span></td></tr>
          <tr><td style="padding-top:40px;font-size:28px;font-weight:600;letter-spacing:-0.02em;">Dein Anmeldecode</td></tr>
          <tr><td style="padding-top:24px;">
            <div style="background:#161618;border-radius:20px;padding:24px;text-align:center;font-size:40px;font-weight:600;letter-spacing:0.3em;font-variant-numeric:tabular-nums;">{{ .Token }}</div>
          </td></tr>
          <tr><td style="padding-top:24px;color:#a1a1a8;font-size:16px;line-height:1.5;">
            Gib den Code in der App ein – oder melde dich direkt mit einem Tipp an:
          </td></tr>
          <tr><td style="padding-top:24px;">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#fff;color:#000;text-decoration:none;font-weight:600;border-radius:999px;padding:16px 28px;">Anmelden</a>
          </td></tr>
          <tr><td style="padding-top:40px;color:#8a8a92;font-size:13px;line-height:1.5;">
            Der Code ist 1 Stunde gültig. Du hast das nicht angefordert? Dann ignoriere diese Mail einfach.
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
